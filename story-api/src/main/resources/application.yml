server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: story-api

  datasource:
    url: jdbc:mysql://localhost:3306/truyen_mb?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: matkhau@102  # ← đổi thành password MySQL của bạn
    driver-class-name: com.mysql.cj.jdbc.Driver



  jpa:
    hibernate:
      ddl-auto: none            # schema đã có sẵn, không tự tạo
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh

# JWT — phải khớp với secret của team auth
app:
  jwt:
    secret: your-very-long-jwt-secret-key-must-be-at-least-256-bits  # ← đồng bộ với team auth
    expiration: 86400000  # 24h (ms) — chỉ để validate, không generate

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
